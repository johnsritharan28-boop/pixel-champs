name: Pixel Champs Android Build

on:
  workflow_dispatch:
  push:
    branches:
      - v80-ios-foundation

permissions:
  contents: read

jobs:
  build-android:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Pixel Champs
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install dependencies
        run: npm install

      - name: Prepare Capacitor web assets
        run: |
          rm -rf android www
          mkdir -p www
          cp index.html www/index.html
          cp Pixel_Champs_V77_Playable_Expansion.html www/Pixel_Champs_V77_Playable_Expansion.html
          cp manifest.webmanifest www/manifest.webmanifest
          cp icon.svg www/icon.svg
          cp service-worker.js www/service-worker.js
          for i in $(seq 80 92); do cp "v${i}-enhancements.js" "www/v${i}-enhancements.js"; done
          python3 - <<'PY'
          from pathlib import Path
          p = Path('www/index.html')
          text = p.read_text()
          text = text.replace('PLAYABLE • V79', 'COSMIC • V92')
          scripts = ''.join(f'<script src="./v{i}-enhancements.js"></script>' for i in range(80, 93) if i != 81)
          if 'v92-enhancements.js' not in text:
              text = text.replace('</head>', scripts + '</head>')
          p.write_text(text)
          PY
          cat > capacitor.config.json <<'EOF'
          {"appId":"com.pixelchamps.game","appName":"Pixel Champs","webDir":"www","bundledWebRuntime":false}
          EOF

      - name: Generate Capacitor Android project
        run: npx cap add android

      - name: Sync web app into Android project
        run: npx cap sync android

      - name: Configure Android release
        env:
          VERSION_CODE: ${{ github.run_number }}
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('android/app/build.gradle')
          text = p.read_text()
          text = text.replace('compileSdkVersion project.hasProperty("compileSdkVersion") ? rootProject.ext.compileSdkVersion : 35',
                              'compileSdkVersion 36')
          text = text.replace('targetSdkVersion project.hasProperty("targetSdkVersion") ? rootProject.ext.targetSdkVersion : 35',
                              'targetSdkVersion 36')
          import os
          version_code = os.environ['VERSION_CODE']
          if 'versionCode ' in text:
              import re
              text = re.sub(r'versionCode\\s+\\d+', f'versionCode {version_code}', text, count=1)
          p.write_text(text)
          PY

      - name: Verify Android SDK 36
        run: sdkmanager "platforms;android-36" "build-tools;36.0.0"

      - name: Import Android upload keystore
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          if [ -z "$ANDROID_KEYSTORE_BASE64" ]; then
            echo "Missing ANDROID_KEYSTORE_BASE64 GitHub secret."
            exit 1
          fi
          echo "$ANDROID_KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/pixel-champs-upload.jks"

      - name: Build signed Android App Bundle
        env:
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          if [ -z "$ANDROID_KEYSTORE_PASSWORD" ] || [ -z "$ANDROID_KEY_ALIAS" ] || [ -z "$ANDROID_KEY_PASSWORD" ]; then
            echo "Missing one or more Android signing secrets."
            exit 1
          fi
          cd android
          ./gradlew bundleRelease             -Pandroid.injected.signing.store.file="$RUNNER_TEMP/pixel-champs-upload.jks"             -Pandroid.injected.signing.store.password="$ANDROID_KEYSTORE_PASSWORD"             -Pandroid.injected.signing.key.alias="$ANDROID_KEY_ALIAS"             -Pandroid.injected.signing.key.password="$ANDROID_KEY_PASSWORD"

      - name: Upload Android App Bundle
        uses: actions/upload-artifact@v4
        with:
          name: pixel-champs-android-aab
          path: android/app/build/outputs/bundle/release/app-release.aab
          if-no-files-found: error
