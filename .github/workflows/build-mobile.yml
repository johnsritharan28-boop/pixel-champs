name: Build Pixel Champs mobile apps

on:
  push:
    branches: [mobile-setup]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  android:
    name: Build Android release AAB
    runs-on: ubuntu-latest
    steps:
      - name: Checkout mobile-setup
        uses: actions/checkout@v4
        with:
          ref: mobile-setup

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Install dependencies
        run: npm ci

      - name: Sync Capacitor
        run: npx cap sync android

      - name: Build Android release AAB
        working-directory: android
        run: ./gradlew bundleRelease

      - name: Upload Android AAB
        uses: actions/upload-artifact@v4
        with:
          name: pixel-champs-android-release-aab
          path: android/app/build/outputs/bundle/release/app-release.aab
          if-no-files-found: error

  ios:
    name: Build iOS App Store archive
    runs-on: macos-26
    steps:
      - name: Checkout mobile-setup
        uses: actions/checkout@v4
        with:
          ref: mobile-setup

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Sync Capacitor
        run: npx cap sync ios

      - name: Archive iOS app
        run: xcodebuild -project ios/App/App.xcodeproj -scheme App -configuration Release -sdk iphoneos -archivePath build/ios/PixelChamps.xcarchive CODE_SIGNING_ALLOWED=NO archive

      - name: Upload iOS archive
        uses: actions/upload-artifact@v4
        with:
          name: pixel-champs-ios-release-archive
          path: build/ios/PixelChamps.xcarchive
          if-no-files-found: error
