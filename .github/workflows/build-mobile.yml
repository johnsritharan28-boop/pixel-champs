name: Build Pixel Champs mobile apps

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  android:
    name: Build Android test APK
    runs-on: ubuntu-latest
    steps:
      - name: Checkout mobile-setup
        uses: actions/checkout@v4
        with:
          ref: mobile-setup

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Install dependencies
        run: npm ci

      - name: Sync Capacitor
        run: npx cap sync android

      - name: Build debug APK
        working-directory: android
        run: ./gradlew assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: pixel-champs-android-debug
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error

  ios:
    name: Build iOS simulator app
    runs-on: macos-26
    steps:
      - name: Checkout mobile-setup
        uses: actions/checkout@v4
        with:
          ref: mobile-setup

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Sync Capacitor
        run: npx cap sync ios

      - name: Build iOS simulator app
        run: xcodebuild -workspace ios/App/App.xcworkspace -scheme App -configuration Debug -sdk iphonesimulator -destination 'generic/platform=iOS Simulator' -derivedDataPath build/ios CODE_SIGNING_ALLOWED=NO

      - name: Upload iOS simulator app
        uses: actions/upload-artifact@v4
        with:
          name: pixel-champs-ios-simulator
          path: build/ios/Build/Products/Debug-iphonesimulator/App.app
          if-no-files-found: error
