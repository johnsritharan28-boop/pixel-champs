name: Generate Pixel Champs mobile projects

on:
  push:
    branches: [mobile-setup]
    paths-ignore:
      - 'ios/**'
      - 'android/**'
      - 'package-lock.json'

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - name: Check out mobile branch
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: npm install

      - name: Generate iOS project
        run: |
          if [ ! -d ios ]; then
            npx cap add ios
          fi

      - name: Generate Android project
        run: |
          if [ ! -d android ]; then
            npx cap add android
          fi

      - name: Sync Capacitor projects
        run: npx cap sync

      - name: Commit generated native projects
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add ios android package-lock.json
          if git diff --cached --quiet; then
            echo "No generated changes to commit."
          else
            git commit -m "Generate Pixel Champs iOS and Android projects"
            git push origin HEAD:mobile-setup
          fi
