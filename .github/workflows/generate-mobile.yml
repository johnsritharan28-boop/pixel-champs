name: Generate Mobile Projects

on:
  push:
    branches: [mobile-setup]
    paths-ignore:
      - 'ios/**'
      - 'android/**'
      - 'www/**'
      - 'package-lock.json'

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout mobile-setup
        uses: actions/checkout@v4
        with:
          ref: mobile-setup
          fetch-depth: 0

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Prepare web assets
        run: |
          mkdir -p www
          cp index.html www/index.html

      - name: Install dependencies
        run: npm install

      - name: Generate iOS project
        run: npx cap add ios

      - name: Generate Android project
        run: npx cap add android

      - name: Sync Capacitor
        run: npx cap sync

      - name: Commit generated mobile projects
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add ios android www package-lock.json
          git diff --cached --quiet && exit 0
          git commit -m "Generate iOS and Android projects"
          git push origin mobile-setup
