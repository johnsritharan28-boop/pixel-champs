name: Pixel Champs iOS Build Validation

on:
  push:
    branches:
      - v80-ios-foundation
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-ios:
    runs-on: macos-latest
    steps:
      - name: Checkout Pixel Champs
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install dependencies
        run: npm install
      - name: Prepare Capacitor web assets
        run: |
          rm -rf ios www
          mkdir -p www
          cp index.html www/index.html
          cp Pixel_Champs_V77_Playable_Expansion.html www/Pixel_Champs_V77_Playable_Expansion.html
          cp manifest.webmanifest www/manifest.webmanifest
          cp icon.svg www/icon.svg
          cp service-worker.js www/service-worker.js
          for i in $(seq 80 92); do cp "v${i}-enhancements.js" "www/v${i}-enhancements.js"; done
          python3 - <<'PY'
          from pathlib import Path
          p = Path('www/index.html')
          text = p.read_text()
          text = text.replace('PLAYABLE • V79', 'COSMIC • V92')
          scripts = ''.join(f'<script src="./v{i}-enhancements.js"></script>' for i in range(80, 93) if i != 81)
          if 'v92-enhancements.js' not in text:
              text = text.replace('</head>', scripts + '</head>')
          p.write_text(text)
          PY
          cat > capacitor.config.json <<'EOF'
          {"appId":"com.pixelchamps.game","appName":"Pixel Champs","webDir":"www","bundledWebRuntime":false}
          EOF
      - name: Generate Capacitor iOS project
        run: npx cap add ios
      - name: Sync web app into iOS project
        run: npx cap sync ios
      - name: Build iOS simulator target
        run: |
          xcodebuild -project ios/App/App.xcodeproj -scheme App -sdk iphonesimulator -configuration Debug CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO build
      - name: Upload generated iOS project
        uses: actions/upload-artifact@v4
        with:
          name: pixel-champs-ios-project
          path: ios
          if-no-files-found: error
